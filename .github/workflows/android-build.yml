name: Build Vent Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK Generated
        run: |
          if [ -f "Vent.apk" ]; then
            echo "Vent.apk found at root."
            ls -lh Vent.apk
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Copying app-debug.apk to Vent.apk"
            cp app/build/outputs/apk/debug/app-debug.apk Vent.apk
            ls -lh Vent.apk
          else
            echo "ERROR: APK not found!"
            find . -name "*.apk"
            exit 1
          fi

      - name: Upload Vent APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vent-apk
          path: Vent.apk
          retention-days: 30

      - name: Publish Nightly/Latest Release Asset
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "Vent Latest Build (Gemini AI Logic)"
          body: |
            Автоматическая сборка приложения **Vent** с подключенным **Firebase Gemini AI Logic**.
            
            - **Модели**: `gemini-2.5-flash` (с фолбэком на `gemini-1.5-flash`)
            - **Стиль**: эмпатичный психологический анализ как от близкого друга
            - **Дата**: ${{ github.event.head_commit.timestamp }}
            - **Коммит**: ${{ github.sha }}
          files: Vent.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
